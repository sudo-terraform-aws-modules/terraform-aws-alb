compact: true
quiet: true
framework:
  - terraform

# Examples are demonstration configs - not production hardened.
# Strict security checks run only on the module root.
skip-path:
  - examples/

skip-check:
  - CKV_AWS_2    # HTTP listeners are enforced by precondition to redirect only - plain HTTP forwarding is rejected at plan time
  - CKV_AWS_103  # ssl_policy is validated against an allowlist of TLS 1.2+ policies - insecure policies are rejected at plan time
  - CKV_AWS_260  # Default ingress rule allows HTTP (80) from 0.0.0.0/0 so the ALB can receive browser traffic; the listener precondition enforces HTTP-to-HTTPS redirect - plain HTTP forwarding to targets is rejected at plan time
  - CKV_AWS_382  # Default egress rule allows all outbound so the ALB can reach any backend target; callers should restrict cidr_ipv4 to their VPC CIDR in production via security_group_egress_rules
  - CKV2_AWS_76  # WAF WebACL rule group contents (including Log4j AMR) are the caller's responsibility; module only associates the ACL
