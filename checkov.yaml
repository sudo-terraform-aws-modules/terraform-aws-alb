compact: true
quiet: true
framework:
  - terraform

# Examples are demonstration configs - not production hardened.
# Strict security checks run only on the module root.
skip-path:
  - examples/

skip-check:
  - CKV_AWS_2    # HTTP listeners are enforced by precondition to redirect only - plain HTTP forwarding is rejected at plan time (only honoured when internal = true)
  - CKV_AWS_103  # ssl_policy is validated against an allowlist of TLS 1.2+ policies - insecure policies are rejected at plan time
