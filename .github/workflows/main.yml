on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

name: Terraform CI

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    name: pre-commit
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - uses: hashicorp/setup-terraform@v4

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: |
          SKIP=terraform_validate,terraform_docs,no-commit-to-branch pre-commit run --all-files
          pre-commit run protect-default-branches --all-files --hook-stage pre-push

  checkov:
    runs-on: ubuntu-latest
    name: checkov
    steps:
      - uses: actions/checkout@v6

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          config_file: checkov.yaml
          quiet: true
          soft_fail: false
          download_external_modules: true

  test:
    runs-on: ubuntu-latest
    name: terraform test
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.10"

      - name: terraform init
        run: terraform init -backend=false

      - name: terraform test
        run: terraform test
